<style>
/* Layout: one full-height rendered view, a hairline of chrome above. Material: smoked glass with a light edge. */
:root{
  --bg:#07090c; --fg:#e9ebee; --fg-2:#8e96a1; --rule:#1d2228; --brand:#f0b429;
  --font-ui:"Instrument Sans","Helvetica Neue",Arial,sans-serif; --font-mono:"Martian Mono",ui-monospace,Menlo,monospace;
  --ink:#fbfaf6; --ink-2:rgba(251,250,246,.74); --voice:#ffd98a; --go:#9ff0bd; --warn:#ffc98a; --radius:6px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:12.5px;font-weight:500;letter-spacing:.02em;color:var(--fg-2)}
header h1 b{color:var(--fg);font-weight:600}
.acts{display:flex;gap:6px}
.acts button{font:inherit;font-size:12px;font-weight:500;color:var(--fg-2);background:#0e1216;border:1px solid var(--rule);border-radius:7px;padding:7px 11px;cursor:pointer}
.acts button[aria-pressed="true"]{color:#15120a;background:var(--brand);border-color:var(--brand)}
.acts button:hover:not([aria-pressed="true"]){color:var(--fg)}
.acts button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.stage{position:relative;flex:1;min-height:360px;border-radius:12px;overflow:hidden;background:#0b0f14;isolation:isolate;cursor:grab;touch-action:none;user-select:none}
.stage.drag{cursor:grabbing}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;will-change:filter,transform;transform-origin:50% 60%}
.pane{position:absolute;left:0;top:0;opacity:0;transform-origin:left top;color:var(--ink);--ca:0;clip-path:inset(0 0 100% 0);
  background:linear-gradient(160deg,rgba(26,32,42,.62),rgba(14,18,26,.58));backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-radius:var(--radius);box-shadow:inset 0 1px 0 rgba(255,250,236,.22)}
.pane::before{content:"";position:absolute;inset:0;border-radius:var(--radius);padding:1px;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,250,236,.9),rgba(255,250,236,.28) 32%,rgba(255,250,236,.14) 66%,rgba(255,217,138,.6));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.pane::after{content:"";position:absolute;left:6%;right:44%;top:0;height:1px;pointer-events:none;background:linear-gradient(90deg,rgba(255,250,236,0),rgba(255,250,236,.95),rgba(255,250,236,0))}
.seed{position:absolute;left:0;top:0;height:1.5px;width:0;border-radius:2px;background:linear-gradient(90deg,rgba(255,250,236,.2),#fff9e9 30%,#fff9e9 70%,rgba(255,250,236,.2));box-shadow:0 0 12px 2px rgba(255,240,210,.65),0 0 2px rgba(255,255,255,.9);opacity:0;transform-origin:left center}
.pane .t{text-shadow:calc(var(--ca)*-1px) 0 rgba(255,96,96,.6),calc(var(--ca)*1px) 0 rgba(96,214,255,.6),0 0 10px rgba(255,255,255,.18)}
.pane.g{padding:8px 13px 9px;white-space:nowrap;font-size:15.5px;font-weight:500;display:flex;flex-direction:column;gap:2px}
.pane .fact{font-family:var(--font-mono);font-weight:400;font-size:12px;color:var(--ink-2);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.pane .why{font-size:11.5px;color:var(--voice);font-weight:400}
.pane.c{width:292px;padding:12px 15px 11px}
.pane.c .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pane.c .name{font-weight:600;font-size:20px;line-height:1.1;letter-spacing:-.005em}
.pane.c .yr{font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.pane.c .meta{margin-top:4px;font-size:13.5px;color:var(--ink-2)}
.pane.c .live{display:flex;align-items:center;gap:7px;margin-top:10px;font-family:var(--font-mono);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pane.c .live i{width:5px;height:5px;border-radius:50%;background:var(--go);box-shadow:0 0 0 3px rgba(159,240,189,.18),0 0 8px rgba(159,240,189,.9);flex:none}
.pane.c .why{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,250,236,.16)}
.pane.c .hint-inline{margin-top:9px;text-align:right;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;color:rgba(251,250,246,.5)}
.pane.c .hint{margin-top:9px;text-align:right;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;color:rgba(251,250,246,.5)}
.view{position:absolute;inset:0;pointer-events:none;font-family:var(--font-ui);color:var(--ink)}
.panel{position:absolute;left:18px;bottom:13%;width:min(392px,calc(100% - 36px));padding:15px 17px 14px;opacity:0;--ca:0;clip-path:inset(0 0 100% 0);pointer-events:auto;
  background:linear-gradient(160deg,rgba(26,32,42,.7),rgba(14,18,26,.66));backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-radius:var(--radius);box-shadow:inset 0 1px 0 rgba(255,250,236,.22)}
.panel::before{content:"";position:absolute;inset:0;border-radius:var(--radius);padding:1px;pointer-events:none;background:linear-gradient(120deg,rgba(255,250,236,.9),rgba(255,250,236,.28) 32%,rgba(255,250,236,.14) 66%,rgba(255,217,138,.6));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel .name{font-weight:600;font-size:21px;letter-spacing:-.01em}
.panel .sub{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.panel .yr{font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.shows{list-style:none;margin:12px 0 0;padding:0}
.shows li{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid rgba(255,250,236,.12);font-size:13.5px}
.shows li:first-child{border-top:0}
.shows li time{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
.shows li em{font-style:normal;font-size:11.5px;color:var(--ink-2);display:block;margin-top:1px}
.shows li .seats{font-family:var(--font-mono);font-size:11px;color:var(--go);white-space:nowrap}
.shows li .seats.low{color:var(--warn)}
.shows li.now b{color:var(--voice)}
.pacts{display:flex;gap:8px;margin-top:12px}
.pacts button{font:inherit;font-size:12.5px;font-weight:500;color:var(--ink);background:rgba(255,250,236,.07);border:1px solid rgba(255,250,236,.3);border-radius:4px;padding:8px 12px;cursor:pointer;flex:1}
.pacts button.primary{background:rgba(255,250,236,.92);color:#1a1712;border-color:transparent;box-shadow:0 0 18px rgba(255,236,190,.25)}
.panel .why{margin-top:10px;font-size:11.5px;color:var(--voice)}
.walk{position:absolute;left:52%;bottom:7%;transform:translateX(-50%) perspective(420px) rotateX(58deg);transform-origin:center bottom;font-family:var(--font-mono);font-size:34px;font-weight:500;letter-spacing:.16em;color:#fff8ea;text-shadow:0 0 14px rgba(255,240,210,.55),0 1px 2px rgba(0,0,0,.35);opacity:0;white-space:nowrap;font-variant-numeric:tabular-nums}
.walk b{font-weight:500;color:var(--go);text-shadow:0 0 14px rgba(159,240,189,.7)}
.held{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;color:var(--voice);opacity:0;letter-spacing:.04em}
.held i{width:8px;height:8px;border-radius:2px;background:var(--voice);transform:rotate(45deg);box-shadow:0 0 0 3px rgba(255,217,138,.18),0 0 10px rgba(255,217,138,.9)}
.ihint{position:absolute;right:14px;bottom:14px;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:3px 7px;background:rgba(6,10,14,.35)}
.caption{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);opacity:0;white-space:nowrap}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#0b0f14;color:#9aa3ad;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;z-index:5;transition:opacity .8s}
.loading.done{opacity:0;pointer-events:none}
.err{position:absolute;left:12px;bottom:12px;right:12px;background:#2a0f0f;color:#ffd9d4;padding:10px;border-radius:6px;font-family:var(--font-mono);font-size:11px;z-index:9}
@media (max-width:640px){.pane.c{width:220px}.walk{font-size:26px}}

.layout{display:grid;grid-template-columns:232px 1fr;gap:10px;flex:1;min-height:0}
.scenes{display:flex;flex-direction:column;gap:4px;background:#0e1216;border:1px solid var(--rule);border-radius:10px;padding:6px;overflow:auto}
.scenes button{font:inherit;text-align:left;font-size:13px;color:var(--fg-2);background:transparent;border:0;border-radius:7px;padding:9px 10px;cursor:pointer;display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:baseline}
.scenes button b{font-weight:500;color:var(--fg)}
.scenes button i{font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:#4d545e}
.scenes button[aria-pressed="true"]{background:#2a3039;color:var(--fg)}
.scenes button:hover:not([aria-pressed="true"]){color:var(--fg);background:#1e2329}
.dock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:#0e1216;border:1px solid var(--rule);border-radius:8px;padding:3px;gap:2px}
.seg button,.pill{font:inherit;font-size:12.5px;font-weight:500;color:var(--fg-2);background:transparent;border:0;border-radius:6px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--fg);background:#2a3039}
.pill{border:1px solid var(--rule);border-radius:8px;background:#0e1216}
.pill[aria-pressed="true"]{color:#15120a;background:var(--brand);border-color:var(--brand)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#4d545e;font-weight:600}
.note{font-size:13px;color:var(--fg-2);line-height:1.45;max-width:78ch;min-height:2.9em}
.note b{color:var(--fg);font-weight:600}
.focus{position:absolute;left:33.3%;top:30%;width:33.4%;height:40%;border:1px dashed rgba(255,120,110,.8);border-radius:10px;pointer-events:none;display:none;transition:left .32s,top .32s,width .32s,height .32s}
.focus::after{content:attr(data-label);position:absolute;left:8px;bottom:6px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:rgba(255,160,150,.95)}
.stage.showfocus .focus{display:block}
.whisper{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font-family:var(--font-ui);font-size:15px;color:var(--ink);opacity:0;white-space:nowrap;text-shadow:0 0 12px rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.5)}
.whisper b{font-family:var(--font-mono);font-weight:400;color:var(--voice)}
.saved{position:absolute;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--voice);opacity:0;white-space:nowrap;text-shadow:0 0 8px rgba(255,217,138,.8)}
.pocket{position:absolute;left:16px;bottom:44px;width:min(300px,calc(100% - 32px));opacity:0;--ca:0;clip-path:inset(0 0 100% 0);padding:11px 13px 12px;color:var(--ink);background:linear-gradient(160deg,rgba(26,32,42,.7),rgba(14,18,26,.66));backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-radius:var(--radius);box-shadow:inset 0 1px 0 rgba(255,250,236,.22)}
.pocket::before{content:"";position:absolute;inset:0;border-radius:var(--radius);padding:1px;pointer-events:none;background:linear-gradient(120deg,rgba(255,250,236,.9),rgba(255,250,236,.28) 32%,rgba(255,250,236,.14) 66%,rgba(255,217,138,.6));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.pocket .h{font-family:var(--font-mono);font-size:11.5px;color:var(--voice);letter-spacing:.04em}
.pocket .h b{font-weight:500}
.pocket ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.pocket li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-top:1px solid rgba(255,250,236,.12)}
.pocket li:first-child{border-top:0;padding-top:0}
.pocket li span:last-child{font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.trace{position:absolute;left:0;top:0;width:0;height:1px;border-top:1px dashed rgba(255,250,236,.5);opacity:0;transform-origin:left center;pointer-events:none}
.edge{position:absolute;left:0;top:0;width:4px;height:26px;border-radius:3px;background:#fff4d6;box-shadow:0 0 10px 2px rgba(255,220,150,.9),0 0 24px 6px rgba(255,200,120,.5);opacity:0;pointer-events:none;margin:-13px 0 0 -2px}
.band{position:absolute;right:14px;bottom:44px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);background:rgba(6,10,14,.35);border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:3px 7px}
.band b{color:var(--voice);font-weight:500}
.hint{position:absolute;right:14px;bottom:14px;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:3px 7px;background:rgba(6,10,14,.35)}
@media (max-width:760px){.layout{grid-template-columns:1fr}.scenes{flex-direction:row;overflow-x:auto}.scenes button{white-space:nowrap;grid-template-columns:auto;gap:2px}.scenes button i{display:none}}
</style>

<header>
  <h1><b>Proactive UI for AI Glasses</b> · Walking rules · the wearer actually walks · drag to look · hover a light to dwell · click to pinch</h1>
  <div class="acts"><button type="button" id="snd" aria-pressed="false">Sound</button><button type="button" id="replay">Replay scene</button></div>
</header>
<div class="layout">
  <nav class="scenes" id="scenes" aria-label="Rules"></nav>
  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="hud" id="hud">
      <div class="seed" id="seed"></div>
      <div class="trace" id="trace"></div>
      <div class="pane g" id="glance"><span class="t n"></span><span class="fact t"></span><span class="why t"></span></div>
      <div class="pane c" id="card">
        <div class="row"><span class="name t"></span><span class="yr t"></span></div>
        <div class="meta t"></div>
        <div class="live t"><i></i><span class="lv"></span></div>
        <div class="why t"></div>
        <div class="hint2 hint-inline"></div>
      </div>
      <div class="saved" id="saved">SAVED</div>
      <div class="edge" id="edge"></div>
    </div>
    <div class="view">
      <div class="pocket" id="pocket"><div class="h"><b id="pocketT">14 s</b> · what you saved</div><ul id="pocketList"></ul></div>
      <div class="whisper" id="whisper"></div>
      <div class="walk" id="walk"><b id="walkw">WAIT</b> <span id="count">14</span></div>
      <div class="held" id="held"><i></i><span id="heldT">Held</span></div>
      <div class="band" id="bandEl">PACE · <b id="bandName">walk</b> · <span id="bandSpeed">1.3</span> m/s</div>
      <div class="hint" id="hint">PINCH · SAVES WHILE WALKING</div>
      <div class="caption" id="caption"></div>
    </div>
    <div class="focus" id="focus" data-label="Focus zone"></div>
    <div class="loading" id="loading"><span id="loadmsg">Raising the block</span></div>
  </div>
</div>
<div class="dock">
  <div class="group">
    <span class="lbl">Pace</span>
    <div class="seg" role="group" aria-label="Pace">
      <button type="button" data-pace="0" aria-pressed="false">Stop</button>
      <button type="button" data-pace="0.6" aria-pressed="false">Stroll</button>
      <button type="button" data-pace="1.3" aria-pressed="true">Walk</button>
      <button type="button" data-pace="1.9" aria-pressed="false">Brisk</button>
    </div>
    <button type="button" class="pill" id="handsBtn" aria-pressed="false">Hands busy</button>
  </div>
  <div class="group">
    <button type="button" class="pill" id="focusBtn" aria-pressed="false">Show focus zone</button>
  </div>
</div>
<p class="note" id="note"></p>

  $('#bandName').textContent=S.band;$('#bandSpeed').textContent=S.speed.toFixed(1);
  // snooze

  if(!dwell){S.gazeTold=false;}
  const allowCard=S.band==='stopped'?800:S.band==='stroll'?1000:1600;
  const effDwell=S.hands?allowCard+600:allowCard;
  const whisperMode=S.band==='brisk'||(S.hands&&S.band==='walk');

    if(dwell&&S.gazeMs>800&&!S.whispered){S.whispered=true;const p=PLACES[active];whisperLine(`${p.name} <b>·</b> ${p.short.split(' · ')[1]}`);}
    if(S.level>0)foldAll();
  }else{
    if(dwell&&S.gazeMs>800&&S.level===0){showGlance();}
    if(dwell&&S.gazeMs>800+effDwell&&S.level===1){showCard();}
  }
  if(!dwell){S.whispered=false;}
  // auto-fold while moving
  const limit=S.band==='walk'||S.band==='brisk'?2.5:S.band==='stroll'?4:1e9;

    for(const o of [walker,truck]){if(!o.userData.v)continue;const r=rectOf(o);if(r&&r.x0<home.x+home.w&&r.x1>home.x&&r.y0<home.y+home.h&&r.y1>home.y){hit=r;break;}}

    gsap.set(trace,{opacity:Math.abs(S.keepX||0)>4?.8:0,x:S.keepX>0?home.x:home.x+home.w,y:home.y+home.h/2,width:Math.abs(S.keepX||0),scaleX:S.keepX>0?1:-1});

  if(S.offscreen)dimT=0;

}

const SCENES=[
{id:'pace',name:'Pace and the focus zone',note:'<b>Rule 1 to 4.</b> The wearer walks past the theater. The keep-out zone scales with speed, glances enter at the edge, a card is only allowed once you slow down, and anything shown while moving folds itself after 2.5 s. Change the pace while it runs.',

}

  if(STILL){const r=e=>{const b=e.getBoundingClientRect(),st=stage.getBoundingClientRect();return[Math.round(b.left-st.left),Math.round(b.top-st.top),Math.round(b.width),Math.round(b.height),getComputedStyle(e).opacity,getComputedStyle(e).clipPath]};
    const state=()=>({simT:+simT.toFixed(2),a:toScreen(A),G,C,glance:r(glance),card:r(card),pocket:r(pocket),whisper:r(whisper),seed:r(seedEl),level:S.level,band:S.band,speed:+S.speed.toFixed(2),lead:UI.lead,leadOn:UI.leadOn,lum:lastLum,yaw:+yaw.toFixed(2),pitch:+pitch.toFixed(2),hud:hud.style.opacity,keepX:Math.round(S.keepX||0),yield:+S.yield.toFixed(2),pocketN:S.pocket.length,snooze:Math.round(S.snooze),walkZ:+S.walkZ.toFixed(1)});
